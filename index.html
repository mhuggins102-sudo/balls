<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1320">
  <title>Ball Drop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23f5c542'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-item">
        <span class="hud-label">Balance</span>
        <span class="hud-value" id="hud-balance">$0</span>
      </div>
      <div class="hud-item hud-quota">
        <span class="hud-label" id="hud-stage">Stage 1/5 · Round 1/3</span>
        <span class="hud-value" id="hud-quota">Quota $25 in 3 rounds</span>
      </div>
      <button class="icon-btn" id="btn-bag" data-action="bag" aria-label="Bag">Bag<span id="hud-bag-count" class="badge">8</span></button>
      <button class="icon-btn" id="btn-menu" data-action="menu" aria-label="Menu">☰</button>
    </header>
    <main id="board-wrap">
      <canvas id="board" aria-label="Ball drop board"></canvas>
      <div id="board-hint" hidden></div>
    </main>
    <section id="panel" aria-live="polite"></section>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
